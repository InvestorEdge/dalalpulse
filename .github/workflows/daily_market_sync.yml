name: Automated Daily Market Sync (NSE & BSE)

on:
  schedule:
    # Runs at 11:30 UTC (5:00 PM IST) Monday through Friday
    - cron: '30 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Market Sync Script
        run: python scripts/sync_market_updates.py

      - name: Commit & Push Daily Updates (If Changed)
        run: |
          git config --global user.name "InvestorEdge Market Bot"
          git config --global user.email "bot@investoredge.internal"
          git add -A
          if git diff --staged --quiet; then
            echo "No market data changes to commit."
          else
            git commit -m "Auto-sync: Daily Indian market closing figures [skip ci]"
            git push
          fi
